- name: get_databases
  description: Return a list of all user databases on the database instance/server.
  parameters:
    db_type:
      type: string
      enum: [sql_server, sqlite]
      description: Enum for the type of database system
    server_name:
      type: string
      description: Name of the database server. For SQLite, use this for the database file path
    user:
      type: string
      description: User name. Not required for SQL Server or SQLite.
    password:
      type: string
      description: Password. Not required for SQL Server or SQLite.
    port:
      type: integer
      description: Port number. Not required for SQL Server or SQLite.

- name: get_db_objects
  description: Return all user-created objects from a specified database.
  parameters:
    db_type:
      type: string
      enum: [sql_server, sqlite]
      description: Enum for the type of database system  
    server_name:
      type: string
      description: Name of the database server For SQLite, use this for the database file path
    db_name:
      type: string
      description: Name of the database
    user:
      type: string
      description: User name. Not required for SQL Server or SQLite.
    password:
      type: string
      description: Password. Not required for SQL Server or SQLite.
    port:
      type: integer
      description: Port number. Not required for SQL Server or SQLite.
      
- name: get_object_definition
  description: Return the SQL for the definition of the specified object.
  parameters:
    db_type:
      type: string
      enum: [sql_server, sqlite]
      description: Enum for the type of database system 
    server_name:
      type: string
      description: Name of the database server For SQLite, use this for the database file path
    db_name:
      type: string
      description: Name of the database
    schema:
      type: string
      description: Name of the schema
    object_name:
      type: string
      description: Name of the object
    user:
      type: string
      description: User name. Not required for SQL Server or SQLite.
    password:
      type: string
      description: Password. Not required for SQL Server or SQLite.
    port:
      type: integer
      description: Port number. Not required for SQL Server or SQLite.
      
- name: execute_select_query
  description: Execute a SELECT query against the specified database
  parameters:
    db_type:
      type: string
      enum: [sql_server, sqlite]
      description: Enum for the type of database system 
    server_name:
      type: string
      description: Name of the database server For SQLite, use this for the database file path
    db_name:
      type: string
      description: Name of the database
    user:
      type: string
      description: User name. Not required for SQL Server or SQLite.
    password:
      type: string
      description: Password. Not required for SQL Server or SQLite.
    port:
      type: integer
      description: Port number. Not required for SQL Server or SQLite.      
    sql:
      type: string
      description: The SQL for the query to execute
     
- name: save_file
  description: Save the contents to the specified file name.
  parameters:
    directory_path:
      type: string
      description: The path of the directory where the file will be saved
    filename:
      type: string
      description: Name of the file
    content:
      type: string
      description: The contents to save to the file  

- name: list_files
  description: List all files found in the specified directory.
  parameters:
    directory:
      type: string
      description: Name of the directory
            
- name: read_file
  description: Read the contents of the file specified by the filepath parameter.
  parameters:
    filepath:
      type: string
      description: The path to the file
